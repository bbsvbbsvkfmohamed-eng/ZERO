<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Unban - فك حظر واتساب</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #111b21;
            color: #e9edef;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }
        .container {
            background: #202c33;
            border-radius: 12px;
            width: 100%;
            max-width: 550px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-top: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #2a3942;
        }
        .header h1 { color: #00a884; font-size: 22px; margin-bottom: 8px; }
        .header p { color: #8696a0; font-size: 13px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            color: #00a884;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .form-group label .required { color: #ea4335; }
        .phone-group { display: flex; gap: 10px; }
        .phone-group select {
            width: 130px;
            padding: 12px;
            background: #2a3942;
            border: 1px solid #3b4a54;
            border-radius: 8px;
            color: #e9edef;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .phone-group select:focus { outline: none; border-color: #00a884; }
        .phone-group input {
            flex: 1;
            padding: 12px;
            background: #2a3942;
            border: 1px solid #3b4a54;
            border-radius: 8px;
            color: #e9edef;
            font-size: 14px;
            direction: ltr;
            text-align: left;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            background: #2a3942;
            border: 1px solid #3b4a54;
            border-radius: 8px;
            color: #e9edef;
            font-size: 14px;
            font-family: inherit;
        }
        input:focus, textarea:focus { outline: none; border-color: #00a884; }
        input::placeholder, textarea::placeholder { color: #667781; }
        textarea { height: 140px; resize: vertical; direction: ltr; }
        .platform-group { display: flex; flex-direction: column; gap: 10px; }
        .platform-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: #2a3942;
            border: 1px solid #3b4a54;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .platform-option:hover { border-color: #00a884; }
        .platform-option.selected {
            border-color: #00a884;
            background: rgba(0, 168, 132, 0.1);
        }
        .platform-option input[type="radio"] { width: auto; accent-color: #00a884; }
        .platform-option label { color: #e9edef; font-size: 14px; cursor: pointer; margin: 0; }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #00a884;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
            font-family: inherit;
        }
        .submit-btn:hover { background: #06cf9c; }
        .submit-btn:disabled { background: #3b4a54; cursor: not-allowed; }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            text-align: center;
            line-height: 1.8;
        }
        .result.success {
            display: block;
            background: rgba(0, 168, 132, 0.15);
            border: 1px solid #00a884;
            color: #00a884;
        }
        .result.error {
            display: block;
            background: rgba(234, 67, 53, 0.15);
            border: 1px solid #ea4335;
            color: #ea4335;
        }
        .result.info {
            display: block;
            background: rgba(0, 122, 255, 0.15);
            border: 1px solid #007aff;
            color: #00a884;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #2a3942;
            color: #667781;
            font-size: 11px;
        }
        .email-preview {
            background: #111b21;
            border: 1px solid #3b4a54;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            font-size: 12px;
            color: #8696a0;
            text-align: left;
            direction: ltr;
            white-space: pre-wrap;
            line-height: 1.6;
            display: none;
        }
        .email-preview strong { color: #00a884; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>WhatsApp Unban Request</h1>
            <p>تقديم طلب فك حظر واتساب</p>
        </div>

        <form id="unbanForm">
            <div class="form-group">
                <label>رقم الهاتف <span class="required">*</span></label>
                <div class="phone-group">
                    <select id="countryCode">
                        <option value="+20">+20 (EG)</option>
                        <option value="+966">+966 (SA)</option>
                        <option value="+971">+971 (AE)</option>
                        <option value="+965">+965 (KW)</option>
                        <option value="+973">+973 (BH)</option>
                        <option value="+974">+974 (QA)</option>
                        <option value="+968">+968 (OM)</option>
                        <option value="+962">+962 (JO)</option>
                        <option value="+961">+961 (LB)</option>
                        <option value="+218">+218 (LY)</option>
                        <option value="+216">+216 (TN)</option>
                        <option value="+213">+213 (DZ)</option>
                        <option value="+212">+212 (MA)</option>
                        <option value="+249">+249 (SD)</option>
                        <option value="+1">+1 (US)</option>
                        <option value="+44">+44 (UK)</option>
                        <option value="+49">+49 (DE)</option>
                        <option value="+33">+33 (FR)</option>
                        <option value="+39">+39 (IT)</option>
                        <option value="+34">+34 (ES)</option>
                        <option value="+90">+90 (TR)</option>
                        <option value="+92">+92 (PK)</option>
                        <option value="+91">+91 (IN)</option>
                        <option value="+880">+880 (BD)</option>
                        <option value="+62">+62 (ID)</option>
                        <option value="+60">+60 (MY)</option>
                        <option value="+63">+63 (PH)</option>
                        <option value="+66">+66 (TH)</option>
                        <option value="+84">+84 (VN)</option>
                        <option value="+86">+86 (CN)</option>
                        <option value="+81">+81 (JP)</option>
                        <option value="+82">+82 (KR)</option>
                        <option value="+7">+7 (RU)</option>
                        <option value="+380">+380 (UA)</option>
                        <option value="+48">+48 (PL)</option>
                        <option value="+46">+46 (SE)</option>
                        <option value="+47">+47 (NO)</option>
                        <option value="+45">+45 (DK)</option>
                        <option value="+358">+358 (FI)</option>
                        <option value="+31">+31 (NL)</option>
                        <option value="+32">+32 (BE)</option>
                        <option value="+41">+41 (CH)</option>
                        <option value="+43">+43 (AT)</option>
                        <option value="+351">+351 (PT)</option>
                        <option value="+353">+353 (IE)</option>
                        <option value="+61">+61 (AU)</option>
                        <option value="+64">+64 (NZ)</option>
                        <option value="+55">+55 (BR)</option>
                        <option value="+52">+52 (MX)</option>
                        <option value="+54">+54 (AR)</option>
                        <option value="+56">+56 (CL)</option>
                        <option value="+57">+57 (CO)</option>
                        <option value="+51">+51 (PE)</option>
                        <option value="+234">+234 (NG)</option>
                        <option value="+254">+254 (KE)</option>
                        <option value="+27">+27 (ZA)</option>
                        <option value="+233">+233 (GH)</option>
                        <option value="+251">+251 (ET)</option>
                        <option value="+252">+252 (SO)</option>
                    </select>
                    <input type="tel" id="phoneNumber" placeholder="أدخل رقم الهاتف" required>
                </div>
            </div>

            <div class="form-group">
                <label>عنوان البريد الإلكتروني <span class="required">*</span></label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label>كيف تستخدم واتساب؟ <span class="required">*</span></label>
                <div class="platform-group">
                    <div class="platform-option" onclick="selectPlatform(this, 'android')">
                        <input type="radio" name="platform" id="android" value="android">
                        <label for="android">Android</label>
                    </div>
                    <div class="platform-option" onclick="selectPlatform(this, 'iphone')">
                        <input type="radio" name="platform" id="iphone" value="iphone">
                        <label for="iphone">iPhone</label>
                    </div>
                    <div class="platform-option selected" onclick="selectPlatform(this, 'web')">
                        <input type="radio" name="platform" id="web" value="web" checked>
                        <label for="web">واتساب للويب و للكمبيوتر</label>
                    </div>
                    <div class="platform-option" onclick="selectPlatform(this, 'kaios')">
                        <input type="radio" name="platform" id="kaios" value="kaios">
                        <label for="kaios">KaiOS</label>
                    </div>
                    <div class="platform-option" onclick="selectPlatform(this, 'other')">
                        <input type="radio" name="platform" id="other" value="other">
                        <label for="other">غير ذلك</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>رسالتك <span class="required">*</span></label>
                <textarea id="message" placeholder="اكتب رسالتك هنا..." required>Dear WhatsApp Support Team,

I am writing to request a review of my WhatsApp account ban. My account was banned and I believe this may have been issued in error.

Phone Number: [Your number here]
Name: [Your name here]

I have not violated any Terms of Service and kindly request a thorough review of my case. Please restore access to my account.

Thank you for your time and assistance.</textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                إرسال طلب فك الحظر
            </button>
        </form>

        <div id="emailPreview" class="email-preview"></div>
        <div id="result" class="result"></div>

        <div class="footer">
            WhatsApp Unban Tool - Email Support
        </div>
    </div>

    <script>
        const WHATSAPP_EMAILS = {
            'android': 'android_web@support.whatsapp.com',
            'iphone': 'iphone_web@support.whatsapp.com',
            'web': 'support@support.whatsapp.com',
            'kaios': 'support@support.whatsapp.com',
            'other': 'support@support.whatsapp.com'
        };

        const PLATFORM_NAMES = {
            'android': 'Android',
            'iphone': 'iPhone',
            'web': 'WhatsApp Web/Desktop',
            'kaios': 'KaiOS',
            'other': 'Other'
        };

        function selectPlatform(element, value) {
            document.querySelectorAll('.platform-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            document.getElementById(value).checked = true;
        }

        document.getElementById('unbanForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');
            const previewDiv = document.getElementById('emailPreview');

            const countryCode = document.getElementById('countryCode').value;
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const email = document.getElementById('email').value.trim();
            const platform = document.querySelector('input[name="platform"]:checked').value;
            const message = document.getElementById('message').value.trim();

            if (!phoneNumber || !email || !message) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = 'Please fill in all required fields';
                resultDiv.style.display = 'block';
                return;
            }

            const fullPhone = countryCode + phoneNumber;
            const toEmail = WHATSAPP_EMAILS[platform] || 'support@support.whatsapp.com';

            const emailSubject = 'WhatsApp Ban Appeal - ' + fullPhone;

            const emailBody = `Dear WhatsApp Support Team,

I am writing to request a review of my WhatsApp account ban.

Phone Number: ${fullPhone}
Email: ${email}
Platform: ${PLATFORM_NAMES[platform] || platform}

Details:
${message}

I kindly request that you review my account and restore access. I believe this ban may have been issued in error and I would appreciate a thorough review of my case.

Thank you for your time and assistance.

Best regards,
${email}`;

            // Show email preview
            previewDiv.innerHTML = '<strong>To:</strong> ' + toEmail + '\n<strong>Subject:</strong> ' + emailSubject + '\n\n' + emailBody;
            previewDiv.style.display = 'block';

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> جاري الإرسال...';
            resultDiv.style.display = 'none';

            try {
                const response = await fetch('https://wwsawwr52.asdas452mo.workers.dev/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phone_number: fullPhone,
                        email: email,
                        platform: platform,
                        message: message
                    })
                });

                const data = await response.json();

                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = '&#10003; تم إرسال الإيميل بنجاح إلى: <strong>' + toEmail + '</strong>';
                } else {
                    // Fallback: open mailto
                    openMailto(toEmail, emailSubject, emailBody);
                    resultDiv.className = 'result info';
                    resultDiv.innerHTML = '&#10003; تم فتح برنامج البريد الإلكتروني. يرجى الإرسال يدوياً إلى:<br><strong>' + toEmail + '</strong>';
                }
            } catch (error) {
                // Fallback: open mailto
                openMailto(toEmail, emailSubject, emailBody);
                resultDiv.className = 'result info';
                resultDiv.innerHTML = '&#10003; تم فتح برنامج البريد الإلكتروني. يرجى الإرسال يدوياً إلى:<br><strong>' + toEmail + '</strong>';
            }

            btn.disabled = false;
            btn.innerHTML = 'إرسال طلب فك الحظر';
            resultDiv.style.display = 'block';
        });

        function openMailto(to, subject, body) {
            const mailtoLink = 'mailto:' + to + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
            window.location.href = mailtoLink;
        }
    </script>
</body>
</html>
